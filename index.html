    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"A Pluma atende fora do Rio de Janeiro?","acceptedAnswer":{"@type":"Answer","text":"Sim. A Pluma opera no Rio de Janeiro e em São Paulo. Para eventos em outras capitais brasileiras, o orçamento inclui deslocamento da direção e equipe técnica."}},{"@type":"Question","name":"Quanto tempo de antecedência é necessário pra fechar um live streaming com a Pluma?","acceptedAnswer":{"@type":"Answer","text":"O ideal é de duas a quatro semanas de antecedência, principalmente para eventos que envolvem mais de duas câmeras ou tradução simultânea. Eventos de última hora são analisados caso a caso."}},{"@type":"Question","name":"A Pluma cobre eventos com múltiplos dias de programação?","acceptedAnswer":{"@type":"Answer","text":"Sim. Convenções, festivais e eventos com programação contínua estão dentro do escopo de atuação da Pluma."}},{"@type":"Question","name":"A Pluma só faz transmissão ou também produz o evento presencial?","acceptedAnswer":{"@type":"Answer","text":"A Pluma é produtora audiovisual focada em transmissão e captação, e traz parceiros de confiança para produzir o evento físico: cenografia, catering, hospitalidade, RSVP e demais frentes de produção."}},{"@type":"Question","name":"A Pluma fornece internet para a transmissão?","acceptedAnswer":{"@type":"Answer","text":"Sim. Para eventos críticos, a Pluma leva internet redundante com link principal e backup, garantindo que a transmissão não caia durante o evento ao vivo."}},{"@type":"Question","name":"O cliente recebe a gravação do evento depois?","acceptedAnswer":{"@type":"Answer","text":"Sim. A Pluma entrega os arquivos master da gravação no fim do evento ou em até 48 horas, dependendo do caso."}},{"@type":"Question","name":"É possível usar a gravação do live streaming para cortar conteúdo depois?","acceptedAnswer":{"@type":"Answer","text":"Sim. A entrega da gravação em qualidade master permite usar a captação ao vivo como matéria-prima para teasers, cortes para redes sociais e peças institucionais. A Pluma também oferece essa edição pós-evento como serviço adicional."}},{"@type":"Question","name":"A Pluma opera com transmissões privadas ou apenas públicas?","acceptedAnswer":{"@type":"Answer","text":"Os dois formatos. Transmissões em plataformas públicas como YouTube, Instagram e LinkedIn, e em ambientes privados como Vimeo OTT, plataformas corporativas, sites com login e eventos restritos por convite. Para conteúdo confidencial, o stream é configurado com a segurança necessária."}},{"@type":"Question","name":"E se o evento atrasar ou estender o horário?","acceptedAnswer":{"@type":"Answer","text":"A proposta cobre uma duração estimada com margem de tolerância. Se o evento se estender significativamente além do previsto, há uma hora adicional combinada previamente. Todas as condições ficam explícitas na proposta antes do fechamento."}},{"@type":"Question","name":"É possível contratar apenas a captação, sem transmissão ao vivo?","acceptedAnswer":{"@type":"Answer","text":"Sim. A Pluma faz captação multicâmera e entrega o material editado ou bruto, sem necessidade de stream ao vivo. É um serviço comum para eventos em que a transmissão não é necessária mas o conteúdo precisa virar peça depois."}},{"@type":"Question","name":"Qual o ticket médio de um live streaming na Pluma?","acceptedAnswer":{"@type":"Answer","text":"O valor varia conforme o escopo do evento. Lives mais simples começam em uma faixa, eventos com várias câmeras e estrutura completa em outra. O orçamento é feito sob medida após conversa inicial pelo WhatsApp."}},{"@type":"Question","name":"O que está incluído no orçamento da Pluma?","acceptedAnswer":{"@type":"Answer","text":"A proposta inclui equipe técnica completa (direção, operadores e assistentes conforme o porte, com comunicação sem fio), equipamentos (câmeras, áudio, switcher, encoder), iluminação, internet redundante, configuração das plataformas de streaming e arquivos de gravação master ao fim do evento. Itens variáveis como cenografia, teleprompter, tradução simultânea ou deslocamento para outras cidades são listados separadamente na proposta."}},{"@type":"Question","name":"Como funciona o pagamento na Pluma?","acceptedAnswer":{"@type":"Answer","text":"A Pluma trabalha com 50% de sinal na confirmação do projeto e 50% até o dia do evento. Para clientes recorrentes ou eventos de maior porte, é possível negociar diferentes condições. A nota fiscal é emitida em nome da Pluma."}},{"@type":"Question","name":"A Pluma tem portfólio de transmissões para mostrar?","acceptedAnswer":{"@type":"Answer","text":"Sim. Como nem toda transmissão pode ser compartilhada publicamente, por confidencialidade do cliente ou contrato, o portfólio de live streaming é apresentado em conversa, conforme o tipo de evento planejado."}}]}</script>
